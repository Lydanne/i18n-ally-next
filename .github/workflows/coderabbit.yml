name: CodeRabbit PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

jobs:
  coderabbit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CodeRabbit is usually installed via GitHub Apps (https://coderabbit.ai)
      # This workflow file serves as documentation that the repo expects CodeRabbit to run.
      # You must install the CodeRabbit GitHub App on your repository to enable the agent.

name: AI PR Reviewer

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}-${{ github.event_name == 'pull_request_review_comment' && 'pr_comment' || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}

jobs:
  review:
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - name: PR Review
        uses: fluxninja/openai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          system_message: |
            You are `@ai-reviewer`, an AI PR Reviewer for the i18n-ally-next project.
            Your job is to strictly enforce the project's PR guidelines and ensure code quality.
            
            You MUST verify the following requirements based on the PR description and code:
            1. The PR description MUST state the proportion of AI-generated/assisted code.
            2. The PR description MUST specify if this is a `fix` (bug fix) or `feat` (new feature).
            3. If this is a `fix`, check that there is a new reproducible fixture in `examples/by-fixtures/issue-<n>` and a corresponding E2E test in `test/e2e/fixtures/issue-<n>`.
            4. If this is a `feat`, check that relevant examples and unit/e2e tests are provided.
            5. The PR MUST update relevant documentation in `docs/` if it changes user-facing features or developer guidelines.
            6. Code style MUST adhere to the project standard (e.g., TypeScript, arrow functions, early returns, no blank lines within functions).
            
            If the PR fails to meet any of the above criteria, politely request changes and clearly state which requirement is missing.

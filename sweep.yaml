# Sweep AI configuration file
# This enables the Sweep AI agent to automatically review issues and create PRs.
# You can trigger it by mentioning @sweep-ai or adding the "sweep" label to an issue.

rules:
  - "Follow the project's documentation and coding style."
  - "When adding new frameworks or features, provide relevant examples and unit/e2e tests."
  - "When fixing a bug, add a reproducible fixture in 'examples/by-fixtures/issue-<n>' and a corresponding E2E test in 'test/e2e/fixtures/issue-<n>'."
  - "Update relevant documentation in 'docs/' if user-facing features or developer guidelines are changed."
  - "State the proportion of AI-generated/assisted code in PR descriptions."
  - "Code should pass 'pnpm test:unit' and 'pnpm test:e2e'."
  - "Linting should pass using 'pnpm lint'."

draft: false
gha_enabled: true
description: "i18n-ally-next is an internationalization (i18n) plugin for VS Code, built with Vue, React, and TypeScript."
